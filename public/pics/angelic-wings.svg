<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="aurora" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fffbe8" />
      <stop offset="30%" stop-color="#fef3c7" />
      <stop offset="65%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#18181b" />
    </radialGradient>
    <filter id="goldenBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#aurora)" />
  
  <!-- Aura Circles -->
  <g transform="translate(600, 360)">
    <circle cx="0" cy="-60" r="100" fill="none" stroke="#fef08a" stroke-width="4" filter="url(#goldenBloom)" />
    <circle cx="0" cy="-60" r="130" fill="none" stroke="#fde047" stroke-width="1.5" stroke-dasharray="6, 6" opacity="0.7" />
    
    <!-- Angelic Wings (Left Wing) -->
    <path d="M -30, -20 C -120,-140 -260,-170 -380,-70 C -340, -10 -280, 50 -180, 90 C -260, 40 -340, 10 -360, 80 C -320, 130 -240, 170 -140, 180 C -220, 160 -290, 170 -290, 220 C -230, 260 -150, 260 -70, 220 C -40, 170 -20, 90 0, 50 Z" 
          fill="#fef9c3" stroke="#f59e0b" stroke-width="3" opacity="0.95" filter="url(#goldenBloom)" />
          
    <!-- Angelic Wings (Right Wing - mirrored) -->
    <path d="M 30, -20 C 120,-140 260,-170 380,-70 C 340, -10 280, 50 180, 90 C 260, 40 340, 10 360, 80 C 320, 130 240, 170 140, 180 C 220, 160 290, 170 290, 220 C 230, 260 150, 260 70, 220 C 40, 170 20, 90 0, 50 Z" 
          fill="#fef9c3" stroke="#f59e0b" stroke-width="3" opacity="0.95" filter="url(#goldenBloom)" />
          
    <!-- Glowing Cross in Center -->
    <path d="M -10, -110 L 10, -110 L 10, -80 L 40, -80 L 40, -60 L 10, -60 L 10, 0 L -10, 0 L -10, -60 L -40, -60 L -40, -80 L -10, -80 Z"
          fill="#ffffff" stroke="#eab308" stroke-width="2" filter="url(#goldenBloom)" />
  </g>

  <!-- Stars / Holy dust -->
  <circle cx="200" cy="180" r="3" fill="#fef08a" opacity="0.7" />
  <circle cx="340" cy="120" r="2" fill="#ffffff" opacity="0.8" />
  <circle cx="860" cy="150" r="3" fill="#fef08a" opacity="0.6" />
  <circle cx="1020" cy="220" r="2.5" fill="#ffffff" opacity="0.9" />
  <circle cx="480" cy="260" r="2" fill="#fef08a" opacity="0.7" />
  <circle cx="720" cy="250" r="2" fill="#fef08a" opacity="0.7" />
</svg>
